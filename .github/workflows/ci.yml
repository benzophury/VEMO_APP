name: CI & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine release version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION_NAME="${TAG_NAME#v}"
          else
            TAG_NAME="v1.0.${GITHUB_RUN_NUMBER}"
            VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Configure release signing (if secrets provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
            cat <<EOF > keystore.properties
          storeFile=release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          else
            echo "No KEYSTORE_BASE64 secret configured; using fallback signing."
          fi

      - name: Verify lint
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" lintDebug

      - name: Run unit tests
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" testDebugUnitTest

      - name: Assemble Release APK
        if: github.event_name != 'pull_request'
        run: |
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" assembleRelease \
            -PversionCode="${{ steps.version.outputs.version_code }}" \
            -PversionName="${{ steps.version.outputs.version_name }}"

      - name: Prepare Release Artifacts
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/VEMO_APP-${{ steps.version.outputs.tag_name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/VEMO_APP-release.apk

      - name: Upload Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: VEMO_APP-${{ steps.version.outputs.tag_name }}-apk
          path: release-artifacts/*.apk

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.version.outputs.tag_name }}"
          APK_VERSIONED="release-artifacts/VEMO_APP-${TAG_NAME}.apk"
          APK_LATEST="release-artifacts/VEMO_APP-release.apk"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK_VERSIONED" "$APK_LATEST" --clobber
          else
            gh release create "$TAG_NAME" "$APK_VERSIONED" "$APK_LATEST" \
              --target "$GITHUB_SHA" \
              --title "VEMO APP $TAG_NAME" \
              --generate-notes
          fi
